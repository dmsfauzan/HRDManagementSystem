; Supervisor untuk queue worker HRIS.
; Simpan di /etc/supervisor/conf.d/hris-worker.conf lalu:
;   sudo supervisorctl reread && sudo supervisorctl update
;
; Ganti /var/www/hris dan user www-data sesuai server.

[program:hris-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/hris/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/hris/storage/logs/worker.log
stopwaitsecs=3600
